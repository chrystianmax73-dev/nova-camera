name: Nova Camera - APK assinado
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar chave persistente (somente de GitHub Secrets)
        shell: bash
        env:
          KS_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          if [[ -z "$KS_BASE64" || -z "$KS_PASS" || -z "$KEY_ALIAS" || -z "$KEY_PASS" ]]; then
            echo 'Faltam os quatro Secrets NOVA_KEYSTORE_BASE64 / NOVA_KEYSTORE_PASSWORD / NOVA_KEY_ALIAS / NOVA_KEY_PASSWORD' >&2
            exit 1
          fi
          printf '%s' "$KS_BASE64" | base64 --decode > "$RUNNER_TEMP/nova-upload-key.jks"
          chmod 600 "$RUNNER_TEMP/nova-upload-key.jks"
      - name: Compilar APK assinado
        env:
          NOVA_KEYSTORE_FILE: ${{ runner.temp }}/nova-upload-key.jks
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Publicar prévia no repositório privado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nova-test-${GITHUB_RUN_NUMBER}"
          APK="Nova-Camera-v0.3-build${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Nova Camera • teste #${GITHUB_RUN_NUMBER}" --notes 'Prévia experimental. Validação necessária no S24 Ultra e S25 Ultra.' --prerelease
          gh release list --limit 100 --json tagName,isPrerelease,createdAt --jq '[.[] | select(.isPrerelease and (.tagName | startswith("nova-test-")))] | sort_by(.createdAt) | reverse | .[2:] | .[].tagName' | while IFS= read -r OLD; do
            [[ -z "$OLD" ]] && continue
            gh release delete "$OLD" --yes --cleanup-tag
          done
