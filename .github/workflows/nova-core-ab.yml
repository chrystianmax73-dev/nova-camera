name: Nova - motor local A/B
on:
  push:
    branches: [codex/nova-adaptive-local-validation]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:compileDebugKotlin
      - name: Exportar somente o motor e runtime JVM, sem fotografias ou chave
        run: |
          python3 - <<'PY'
          import pathlib, io, zipfile, base64, hashlib
          root = pathlib.Path('app/build/tmp/kotlin-classes/debug')
          files = list((root/'com/novacamera/s24/core/imaging').rglob('*.class'))
          assert files
          jars = sorted((pathlib.Path.home()/'.gradle/caches/modules-2/files-2.1').rglob('kotlin-stdlib-2*.jar'), key=lambda p:p.name)
          assert jars
          buffer = io.BytesIO()
          with zipfile.ZipFile(buffer,'w',zipfile.ZIP_DEFLATED) as z:
              for p in files: z.write(p,p.relative_to(root))
              z.write(jars[-1],jars[-1].name)
          data = buffer.getvalue()
          print('NOVA_AB_SAFE_SHA256:'+hashlib.sha256(data).hexdigest())
          encoded = base64.b64encode(data).decode()
          for i in range(0,len(encoded),4096):
              print('NOVA_AB_SAFE:'+'.'.join(encoded[i:i+4096]))
          PY
