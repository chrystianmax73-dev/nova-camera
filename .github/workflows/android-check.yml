name: Android - compilar sem guardar APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      # O download do NDK às vezes chega corrompido ("Error reading Zip content"): até 4 tentativas.
      - name: SDK, NDK e CMake (com novas tentativas)
        run: |
          for i in 1 2 3 4; do
            sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1' && exit 0
            echo "Tentativa $i falhou; nova tentativa em $((i * 10)) s" >&2
            sleep $((i * 10))
          done
          exit 1
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
        # Nenhum APK ou artefato é carregado ou preservado.
